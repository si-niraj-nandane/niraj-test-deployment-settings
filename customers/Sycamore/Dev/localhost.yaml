agent_id: "localhost"
server_type: "ShinyProxyServer"
customer_name: "Sycamore"
environment_name: "Dev"
ansible_roles:
  - ADD_FSAADMIN
  - COMMON_TASKS
  - INSTALL_PACKAGES
  - CONFIGURE_PACKAGES
  - UTILITY
  - AD_JOIN_LINUX
  - SYSTEMD
  - SERVER_CONF
  - MOUNTS
  - SHINY_CONF
  - CONFIGURE_LOGGING
  - START_SERVICES
  - AWSCLI

# Validation tests to run (GOSS)
validation_tests:
  # config:
  #   - os
  #   # - packages
  #   # - limits
  #   # - sysctl
  # # infra:
  #   # - network
  #   # - storage
  # global:
  #   - shinyproxy_integration

services:
  # Infrastructure Services
  - name: "docker"
    type: "software"
    service_name: "docker"
    version: "24.0.7"
    enabled: false

  - name: "nginx"
    type: "web"
    service_name: "nginx-shiny"
    version: "1.29.1"
    enabled: false

  - name: "java"
    type: "software"
    service_name: "java"
    version: "17"
    enabled: false
    configuration:
      distribution: "openjdk"

  # SHINYPROXY Application
  - name: "shinyproxy"
    type: "web"
    service_name: "shinyproxy"
    version: "3.1.1"
    enabled: false
    configuration:
      port: 8080
      ssl_enabled: false
      authentication_type: "ldap"
      ldap_url: "ldap://sycamore.dev.org:389"
      ldap_user_dn_pattern: "cn={0},CN=Users"
      ldap_group_search_base: "OU=Groups,DC=sycamore,DC=dev,DC=org"
      forward_headers: "native"
      cookie_secure: true
      cookie_same_site: "None"

  # R Environment
  - name: "r"
    type: "software"
    service_name: "r"
    version: "4.2.3"
    enabled: false
    configuration:
      packages:
        - "rjson"
        - "rPython"
        - "dplyr"
        - "ggplot2"
        - "plotly"
        - "tidyverse"
        - "reticulate"
        - "data.table"

  # Python Environment
  - name: "python"
    type: "software"
    service_name: "python"
    version: "3.9.21"
    enabled: false

  # Database
  - name: "redis"
    type: "software"
    service_name: "redis"
    version: "6.2.17"
    enabled: false

  # File Sharing - Traditional Samba
  - name: "samba"
    type: "storage"
    service_name: "samba-shiny"
    version: "4.16.4"
    enabled: false
    configuration:
      workgroup: "SYCAMORE"
      realm: "SYCAMORE.DEV.ORG"
      security: "ads"
      winbind_use_default_domain: true
      template_homedir: "/home/%U"

  # File Sharing - Samba Docker Containers for ShinyProxy
  - name: "samba_containers"
    type: "software"
    service_name: "samba_containers"
    enabled: false

  # Authentication Services
  - name: "adcli"
    type: "auth"
    service_name: "adcli"
    version: "0.9.2-1.el9"
    enabled: false

  - name: "chrony"
    type: "time"
    service_name: "chrony"
    version: "latest"
    enabled: false

  # Security Services
  - name: "ssh"
    type: "security"
    service_name: "ssh-shiny"
    version: "latest"
    enabled: false
    configuration:
      port: 22
  
  # Audit Services
  - name: "CDR-Audit-Node"
    type: "cdr"
    service_name: "cdr-audit"
    enabled: false
    version: "atlanta-1.0.3.2"
    ansible_role: "CDR_AUDIT_NODE"

  - name: "awscli"
    type: "software"
    service_name: "awscli"
    version: "2.0"
    enabled: true
    ansible_role: "AWSCLI"
    configuration:
      aws_cli_download_url: "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip"

  # # Storage
  # - name: "nfs"
  #   type: "storage"
  #   service_name: "nfs"
  #   version: "latest"
  #   enabled: false

